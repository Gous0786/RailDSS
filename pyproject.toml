[project]
name = "raildss"
version = "0.1.0"
description = "RailDSS: advisory decision support for Indian Railways section control, with a section-level digital twin (KTV-PSA demo)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "pandas>=2.3",
    "pg8000>=1.31",
    "pyarrow>=21",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "simpy>=4.1.2",
    "tifffile>=2025.1",
]

[project.scripts]
raildss = "raildss_etl.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "import-linter>=2.5",
    "pre-commit>=4.3",
    "types-pyyaml>=6.0.12.20261030",
    "pandas-stubs>=3.1.0.261029",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/raildss_common",
    "src/raildss_schema",
    "src/raildss_params",
    "src/raildss_etl",
    "src/raildss_twin",
    "src/raildss_optimiser",
    "src/raildss_verifier",
    "src/raildss_hitl",
    "src/raildss_dss",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = [
    "raildss_common",
    "raildss_schema",
    "raildss_params",
    "raildss_etl",
    "raildss_twin",
    "raildss_optimiser",
    "raildss_verifier",
    "raildss_hitl",
    "raildss_dss",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pg8000", "pg8000.*"]
ignore_missing_imports = true

# confluent-kafka's admin package re-exports its types without __all__.
[[tool.mypy.overrides]]
module = ["confluent_kafka.admin"]
implicit_reexport = true

# Spec #1: strict typing for the canonical schema package.
[[tool.mypy.overrides]]
module = ["raildss_schema.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs PostgreSQL + PostGIS (RAILDSS_TEST_DB_URL); run in the CI db job",
    "kafka: needs the docker-compose Kafka broker with SASL + ACLs (RAILDSS_TEST_KAFKA_BOOTSTRAP); run in the CI kafka job",
]

# ---------------------------------------------------------------- import-linter
# NFR-MNT-02: the verifier is an independent codebase. It must not import the
# optimiser, the twin or the ETL (diverse redundancy: optimiser != checker != simulator).
[tool.importlinter]
root_packages = [
    "raildss_common",
    "raildss_schema",
    "raildss_params",
    "raildss_etl",
    "raildss_twin",
    "raildss_optimiser",
    "raildss_verifier",
    "raildss_hitl",
    "raildss_dss",
]

[[tool.importlinter.contracts]]
name = "Verifier is independent of optimiser, twin and ETL (NFR-MNT-02)"
type = "forbidden"
source_modules = ["raildss_verifier"]
forbidden_modules = ["raildss_optimiser", "raildss_twin", "raildss_etl"]

[[tool.importlinter.contracts]]
name = "Shared foundations do not depend on applications"
type = "forbidden"
source_modules = ["raildss_common", "raildss_schema", "raildss_params"]
forbidden_modules = [
    "raildss_etl",
    "raildss_twin",
    "raildss_optimiser",
    "raildss_verifier",
    "raildss_hitl",
    "raildss_dss",
]

[[tool.importlinter.contracts]]
name = "DSS services never import the twin: they see only obs.* / ops.* feeds (FR-TWIN-14)"
type = "forbidden"
source_modules = ["raildss_dss"]
forbidden_modules = ["raildss_twin"]
