name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, import boundaries, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag after v7
        with:
          enable-cache: true
      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Import boundaries (NFR-MNT-02)
        run: uv run lint-imports
      - name: Parameter register lint (issue #3)
        run: uv run python -m raildss_params lint
      - name: No literal rule values in code (issue #3)
        run: uv run python tools/lint_literals.py
      - name: Schema artefacts up to date (issue #4)
        run: uv run python -m raildss_schema check
      - name: Mapping spec vs dataset and schema (issue #5)
        run: uv run python -m raildss_etl mapping-check
      - name: Data-quality report and baseline diff (FR-TWIN-21, DQ-14..22)
        run: uv run python -m raildss_etl dq --check
      - name: Network publication rebuilds byte-identically, validator 0 errors (issue #18)
        run: uv run raildss network publish --check
      - name: Event envelope schema up to date (issue #19)
        run: uv run python -m raildss_common schema check
      - name: Kafka topic catalogue and ground-truth isolation lint (issue #19)
        run: uv run python -m raildss_common kafka lint
      - name: Tests (incl. dataset manifest, issue #2)
        run: uv run pytest

  licences:
    name: Licence gate and SBOM (NFR-LIC-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag after v7
      - name: Install runtime dependencies only
        run: |
          uv python install 3.12
          uv sync --frozen --no-dev
          uv pip install pip-licenses cyclonedx-bom
      - name: Licence gate
        run: |
          uv run --no-sync pip-licenses --format=json --with-system > licences.json
          uv run --no-sync python tools/check_licences.py licences.json
      - name: SBOM (CycloneDX)
        run: uv run --no-sync cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-and-licences
          path: |
            sbom.cdx.json
            licences.json

  db:
    name: Database migrations and round-trip (issue #4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.11-ts2.31.0
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      RAILDSS_TEST_DB_URL: postgresql://postgres:ci-not-a-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag after v7
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Database tests (apply, round-trip, revert, re-apply)
        run: uv run pytest -m db -v
      - name: Load the published network and count it (issue #18)
        run: |
          uv run raildss network load KTV-PSA-2025-08 --db-url "$RAILDSS_TEST_DB_URL"
          uv run raildss network show KTV-PSA-2025-08 --db-url "$RAILDSS_TEST_DB_URL"
      - name: Migration CLI up and down
        run: |
          uv run python -m raildss_schema migrate up --url "$RAILDSS_TEST_DB_URL"
          uv run python -m raildss_schema migrate down --url "$RAILDSS_TEST_DB_URL"

  compose:
    name: Compose file validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          KAFKA_ADMIN_PASSWORD: ci-admin-not-a-secret
          KAFKA_TWIN_PASSWORD: ci-twin-not-a-secret
          KAFKA_EVALUATION_PASSWORD: ci-evaluation-not-a-secret
          KAFKA_DSS_PASSWORD: ci-dss-not-a-secret
        run: docker compose config --quiet

  kafka:
    name: Kafka topics, ACLs and ground-truth isolation (issue #19)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-not-a-secret
      KAFKA_ADMIN_PASSWORD: ci-admin-not-a-secret
      KAFKA_TWIN_PASSWORD: ci-twin-not-a-secret
      KAFKA_EVALUATION_PASSWORD: ci-evaluation-not-a-secret
      KAFKA_DSS_PASSWORD: ci-dss-not-a-secret
      RAILDSS_KAFKA_BOOTSTRAP: localhost:9092
      RAILDSS_KAFKA_USERNAME: admin
      RAILDSS_KAFKA_PASSWORD: ci-admin-not-a-secret
      RAILDSS_TEST_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no floating major tag after v7
      - name: Install dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Start the compose Kafka broker (SASL + StandardAuthorizer)
        run: docker compose up -d --wait kafka
      - name: Create topics and ACLs
        run: uv run python -m raildss_common kafka apply
      - name: Re-apply is a no-op (idempotent)
        run: uv run python -m raildss_common kafka apply --expect-no-changes
      - name: Ground-truth isolation deployment check (DQ-12)
        run: uv run python -m raildss_common kafka check
      - name: Kafka integration tests (ACL denial, duplicates, DLQ)
        run: uv run pytest -m kafka -v
      - name: Broker logs on failure
        if: failure()
        run: docker compose logs kafka
