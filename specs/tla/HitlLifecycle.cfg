\* TLC configuration of the bounded HITL lifecycle model (FR-VER-13; issue #82):
\* two recommendations for one decision context (supersede, one per context).
\* CI: java -cp tla2tools.jar tlc2.TLC -config specs/tla/HitlLifecycle.cfg specs/tla/HitlLifecycle.tla
CONSTANTS
    NRecs = 2
    MaxTime = 2
    MaxVer = 1
    Validity = 1
    SameContext = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnePerContext
    NoStaleExecution
    NoTwoAuthorities
    NoExecutionWithoutDecision
    ExpiredWasNotDecided

PROPERTIES
    StaleAcceptedSuperseded

\* Terminal states (every recommendation finished, clock and state version at their bounds) are expected.
CHECK_DEADLOCK FALSE
