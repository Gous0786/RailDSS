# Install with: uv run pre-commit install
# data/ is excluded everywhere: raw data must never be modified (spec C-13, issue #2).
exclude: ^data/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=30000"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import-linter (NFR-MNT-02)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: dataset-manifest
        name: dataset manifest (issue #2)
        entry: uv run python tools/manifest.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: parameter-register
        name: parameter register lint (issue #3)
        entry: uv run python -m raildss_params lint
        language: system
        pass_filenames: false
        files: ^config/parameters\.yaml$
      - id: literal-lint
        name: no literal rule values (issue #3)
        entry: uv run python tools/lint_literals.py
        language: system
        pass_filenames: false
        types: [python]
