    status: SA
    owner: twin
    valid_from: 2026-11-05
    notes: >-
      Calibration search space and acceptance tolerances. Caps are the speed actually held by
      freight (loaded / empty) and passenger trains; the cap pair is chosen on the physics-only fit,
      then non-negative block (freight) or leg (passenger) supplements absorb location effects.
      WTT spans or legs more than padding_band_s above their standard (modal / minimum) time are
      padded and reported, not scored.

