# RailDSS parameter register (spec C-05, FR-DATA-01, FR-DATA-08, Appendix B; issue #3).
#
# Every rule value and threshold used by RailDSS lives here, with a cited source. Code reads
# values only through raildss_params; literal rule values in code are linted (tools/lint_literals.py).
#
# Fields per entry:
#   key         dotted lower-case name (unique)
#   value       the value (number, string, list or mapping)  -- or --
#   value_ref   TABLE.COLUMN when the value is per record in the dataset (e.g. CSR per line)
#   unit        unit string, or null
#   source      report section (e.g. "R06 §2") and/or TABLE.COLUMN
#   status      V | DATA | EST | U | SA | DUMMY
#                 V      verified in a source report
#                 DATA   computed from the KTV-PSA dataset
#                 EST    estimated from data -> requires bounds {low, high}
#                 U      unverified
#                 SA     spec-author default
#                 DUMMY  open-internet secondary source or placeholder (C-14) -> requires provenance
#   owner       team responsible
#   bounds      {low, high} (required for EST)
#   provenance  URL or "placeholder" (required for DUMMY)
#   valid_from  ISO date
#   notes       optional free text

