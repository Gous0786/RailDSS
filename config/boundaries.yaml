# Section boundaries and acceptance windows for KTV-PSA (issue #12; spec FR-TWIN-22, A-12, RK-21, R06 §7).
#
# A boundary is where trains enter or leave the modelled section. Each has:
#   station:    the section station at the boundary
#   blocks:     COA block sections that leave the section through it (WTT rows)
#   via:        neighbouring off-section stations seen in the freight log (it skips stations)
#   log_edge:   section stations where the division freight log starts / ends for loads that
#               cross the division boundary (no neighbouring row exists)
#   default:    used for an unknown neighbour at this station (at most one per station)
# Flows that start or end inside the section are "local:<station>" (sidings, goods sheds).
#
# acceptance_windows: "HH:MM" intervals when a boundary accepts trains (end > start; a window ending at
# midnight is written "24:00"). A window may be limited to some days:
#   weekdays:   [Mon .. Sun], Monday-first; omitted = every day
#   valid_from / valid_to:  inclusive ISO dates; either may be omitted
# On a day where no window applies, the boundary is open (the default; an empty list or a missing
# boundary is always open). On a day where some window applies, the boundary accepts only inside those
# windows. So a closure is written as the accepting windows around it. Windows of one boundary may not
# overlap: same minutes, a shared weekday and a shared date.
#
# Example (closed 02:00-04:00 on Sundays in August 2025; open at every other time):
#   acceptance_windows:
#     KTV-VSKP:
#       - {start: "00:00", end: "02:00", weekdays: [Sun], valid_from: 2025-08-01, valid_to: 2025-08-31}
#       - {start: "04:00", end: "24:00", weekdays: [Sun], valid_from: 2025-08-01, valid_to: 2025-08-31}

boundaries:
  KTV-VSKP:
    station: KTV
    towards: Visakhapatnam via Pendurti / Simhachalam North
    blocks: [KTV-PDT, PDT-KTV]
    via: [PDT, SCMN, VSKP]
    default: true
  KTV-KK:
    station: KTV
    towards: Kirandul (KK line)
    blocks: [KTV-MVW, MVW-KTV]
    via: [MVW]
  VZM-RGDA:
    station: VZM
    towards: Rayagada branch (Gotlam)
    blocks: [VZM-GTLM, GTLM-VZM]
    via: [GTLM, GRBL, RGDA]
    default: true
  NWP-GNPR:
    station: NWP
    towards: Gunupur branch (Tekkali / Parlakhemundi)
    blocks: [NWP-TEK, TEK-NWP, NWP-PLH, PLH-NWP]
    via: [TEK, PLH]
    default: true
  PSA-KUR:
    station: PSA
    towards: Khurda Road division (Summadevi)
    blocks: [PSA-SUDV, SUDV-PSA]
    via: [SUDV]
    log_edge: [PUN, PSA]
    default: true

acceptance_windows: {}

# Freight log gaps: the division log sometimes skips the boundary station or starts / ends
# mid-section for loads from / to other divisions. At a station with a boundary, its default is
# used; elsewhere the load's direction decides (DN runs KTV -> PSA).
gap_fill:
  entry: {DN: KTV-VSKP, UP: PSA-KUR}
  exit: {DN: PSA-KUR, UP: KTV-VSKP}
