# KTV-PSA COA-master -> canonical schema mapping (spec §6.6, FR-DATA-07; issue #5).
#
# Declarative and hand-maintained. The ETL (raildss_etl) reads file paths, cleaning policy, date formats
# and expected row counts from here. Every column of every source file is listed:
#   to: Entity.field   (or a list)  -> populates the canonical schema (raildss_schema.entities)
#   to: raw                          -> kept in the entity's `raw` field, not used by services
#   to: ignore                       -> dropped; `note` gives the reason. ETL code must never reference
#                                       an ignored column (DQ-22, tests/etl/test_mapping.py)
#   conf: H / M / L                  -> confidence from R06 App. A
#   date: <format name>              -> parsed by stage 1 (#6)
mapping_version: "2026.11.1"
dataset: ktv-psa
raw_dir: data/raw/ktv-psa
timezone: "+05:30"                # IST; source timestamps are local time, the canonical store is UTC
open_ended_years:                 # two-digit year 99 marks an open-ended validity (R06 §4.9)
  "1999": 2099
date_formats:
  coa_mdy: "%m/%d/%y"             # 7/15/24  (COA master tables)
  dmy_mon: "%d-%b-%y"             # 21-May-25 (PSR, TRAIN, SCHEDULE)
  freight_dmy_hm: "%d/%m/%Y %H:%M"  # 01/08/2025 22:25 (freight log)
schedule_seconds_columns: [ARRIVAL, DEPARTURE, NEXTARVL]   # seconds since 00:00 of the train's day 1
null_tokens: ["", "NA"]          # treated as missing when decoding values (issue #7)
value_maps:                       # code -> canonical value, used by ETL stage 2+ (issue #7)
  yes_no: {"Y": true, "N": false}
  station_class: {"B": block_station_B, "D": halt}          # R06 App. A.2
  signalling: {"MACL": MACLS}
  block_system: {"AB": ABS_absolute, "AT": AUTO}            # R06 App. A.3
  coa_level: {"1": coa, "0": route_split_at_halt}           # MANCOABLCKSCTN (REC-26)
  recv_send: {"R": receive, "S": send}                      # Connections MACRECVSENDFLAG
  line_direction: {"DN": DN, "UP": UP, "MID": BOTH, "KK": BOTH, "1": BOTH}  # BLOCKSCTNLINE.MAVDRTN is blank; derive from line id
  loaded_empty: {"L": true, "E": false}                              # freight LE
wtt:                              # WTT list encodings (issue #10)
  list_separator: ","             # DAY_OF_SERVICES, BLOCK_BUSY_DAYS, PLATFORM: 7 values, Monday-first
  runs: "1"                       # day-mask value meaning "runs"
  no_value: ["", "0", "N"]        # PLATFORM "0" = none; CREWCHANGE / TRTNCODE "N" = none
ignore_column_patterns:
  - pattern: '^Unnamed: \d+$'
    note: empty columns added by the spreadsheet export ("-Table 1" files, R06 §2)

tables:
  ROUTE_DN:
    file: 'RouteSttnInfo/KTV-PSA-Table 1.csv'
    description: 'Ordered route KTV->PSA (DN)'
    entity: null
    expected_rows: 22
    clean: {drop_blank_rows: true, drop_header_rows: true, deduplicate: none}
    columns:
      'SEQ_NO': {to: OperationalPoint.seq, conf: H, note: 'route order'}
      'ZONE_CODE': {to: raw, conf: M}
      'DIVISION_CODE': {to: raw, conf: M}
      'STATION_CODE': {to: OperationalPoint.code, conf: H, note: 'join key to STATION'}
      'STATION_NAME': {to: raw, conf: H, note: 'duplicate of STATION.MAVSTTNNAME'}
      'JUNC_FLAG': {to: OperationalPoint.is_junction, conf: H}
      'CABIN_FLAG': {to: raw, conf: M}
      'HALT_FLAG': {to: OperationalPoint.is_halt, conf: H, note: 'cross-check with STATION.MACHALTFLAG'}
      'IC_FLAG': {to: raw, conf: M}
      'FROZEN_FLAG': {to: raw, conf: M}
      'DVSNIC': {to: raw, conf: M}
      'FROM_STATION': {to: raw, conf: M}
      'TO_STATION': {to: raw, conf: M}
      'BLOCK_SECTION': {to: BlockSection.id, conf: H, note: 'route level (split at halts)'}
      'REVERSE_BLOCK_SECTION': {to: raw, conf: M}
      'OPPBLCKSCTN': {to: raw, conf: M}
      'COABLCKSCTN': {to: BlockSection.id, conf: H, note: 'COA level (REC-26)'}
      'COARVSEBLCKSCTN': {to: raw, conf: M}
      'COAOPPBLCKSCTN': {to: raw, conf: M}
      'DISTANCE': {to: BlockSection.length_m, conf: H, note: 'km x 1000, route level'}
      'COADISTANCE': {to: BlockSection.length_m, conf: H, note: 'km x 1000, COA level'}
      'CUM_DISTANCE': {to: OperationalPoint.km, conf: H, note: 'section chainage from KTV (DN table)'}
      'NO_SIGNAL': {to: ignore, conf: H, note: 'always 0 or empty in this extract; no signal-level data (R06 §4.4)'}
      'SIGNALTYPE': {to: BlockSection.system, conf: H, note: 'AB -> ABS_absolute, AT -> AUTO'}
      'TRACTION': {to: raw, conf: M}
      'NOOFTRACKS': {to: BlockSection.n_lines, conf: H}
      'NOOFTRAIN': {to: raw, conf: M}
